<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="SportScore — the free real-time scoreboard for tennis, padel, pickleball, table tennis, squash and badminton." />
    <title>SportScore — Real-Time Racquet Sports Scoreboard</title>

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "SportScore",
        "url": "https://sportscore.onrender.com/",
        "description": "The free real-time scoreboard for tennis, padel, pickleball, table tennis, squash and badminton."
      }
    </script>

    <!-- Sentry browser loader (lazy: the SDK is fetched on first use). -->
    <script
      src="https://js.sentry-cdn.com/ca8be8cd59c04421fe7fdc8ee81b1fca.min.js"
      crossorigin="anonymous"
    ></script>

    <!-- Open Graph / link previews (server-side injected per route; see server.mjs) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SportScore" />
    <meta property="og:title" content="SportScore — Real-Time Racquet Sports Scoreboard" />
    <meta property="og:description" content="Score matches point by point, live. Tennis, padel, pickleball, table tennis, squash and badminton." />
    <meta property="og:url" content="https://sportscore.onrender.com/" />
    <meta property="og:image" content="https://sportscore.onrender.com/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SportScore — Real-Time Racquet Sports Scoreboard" />
    <meta name="twitter:description" content="Score matches point by point, live, with friends." />
    <meta name="twitter:image" content="https://sportscore.onrender.com/og.png" />
    <!--PREVIEW-META-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%8E%BE%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
